<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Driver Check-in — Driver Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #1a1f36;
      --border: rgba(148,163,184,0.12);
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --success-bg: rgba(34,197,94,0.12);
      --error: #ef4444;
      --error-bg: rgba(239,68,68,0.12);
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 140%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(99,102,241,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      animation: fadeUp .5s ease;
      position: relative;
      z-index: 1;
    }

    .logo { text-align: center; margin-bottom: 24px; margin-top: 10px; }
    .logo-title {
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .driver-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .driver-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
    }
    .status-none    { background: rgba(148,163,184,0.12); color: var(--muted); }
    .status-in      { background: var(--success-bg); color: var(--success); }
    .status-done    { background: rgba(99,102,241,0.12); color: var(--accent); }

    .clock-display {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .date-display {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 16px 12px;
      border: none;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-checkin { background: var(--grad); color: white; box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
    .btn-checkout { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 4px 16px rgba(34,197,94,0.3); }
    .btn-history { background: rgba(255,255,255,0.1); color: white; grid-column: span 2; padding: 14px; flex-direction: row; }

    .result-msg {
      border-radius: 12px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .result-msg.success { background: var(--success-bg); color: var(--success); display: block; }
    .result-msg.error   { background: var(--error-bg); color: var(--error); display: block; }

    /* Modal for History */
    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      width: 100%; max-width: 400px;
      border-radius: 20px;
      border: 1px solid var(--border);
      max-height: 80vh;
      display: flex; flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 700;
    }
    .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 0; overflow-y: auto; flex: 1; }
    
    .history-item {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-weight: 600; margin-bottom: 4px; }
    .history-type { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--muted); }
    .history-times { font-size: 0.85rem; color: var(--muted); text-align: right; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Calendar Styles */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-weekday { text-align: center; font-size: 0.75rem; color: var(--muted); font-weight: 600; padding: 4px; }
    .calendar-day { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 48px; }
    .calendar-day.empty { background: transparent; cursor: default; }
    .calendar-day.today { border: 1px solid var(--accent); color: var(--accent); }
    .calendar-day.holiday { color: var(--error); }
    .calendar-day:active { transform: scale(0.95); }
    .sch-badge { font-size: 10px; background: var(--accent2); color: white; border-radius: 4px; padding: 2px 0; margin-top: 4px; width: 100%; text-align: center; }
    /* Notification Toggle Card */
    .notif-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .notif-info { flex: 1; }
    .notif-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .notif-sub { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    /* Toggle Switch */
    .toggle-wrap { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.12);
      border-radius: 28px;
      transition: .3s;
    }
    .toggle-slider:before {
      content: '';
      position: absolute;
      height: 20px; width: 20px;
      left: 4px; bottom: 4px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }
    .toggle-wrap input:checked + .toggle-slider { background: var(--accent); }
    .toggle-wrap input:checked + .toggle-slider:before { transform: translateX(24px); }
    .notif-status {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-top: 6px;
      display: inline-block;
    }
    .notif-status.on  { background: rgba(34,197,94,0.15); color: var(--success); }
    .notif-status.off { background: rgba(148,163,184,0.12); color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-title">🚗 Driver Attendance</div>
    </div>

    <div id="loading" style="text-align:center; color:var(--muted); padding: 40px 0;">
      Loading...
    </div>

    <div id="main" style="display:none">
      <div class="clock-display" id="clock"></div>
      <div class="date-display" id="date-display"></div>

      <div class="driver-card">
        <div class="driver-name" id="driver-name-el"></div>
        <div class="status-badge" id="status-badge"></div>
        
        <div style="margin-top:20px; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; text-align:left;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.9rem;">
            <span style="color:var(--muted)">Clock In</span>
            <strong id="info-checkin">—</strong>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
            <span style="color:var(--muted)">Clock Out</span>
            <strong id="info-checkout">—</strong>
          </div>
        </div>
      </div>

      <div class="result-msg" id="result-msg"></div>

      <div class="menu-grid">
        <button class="btn btn-checkin" id="btn-checkin" onclick="doCheckIn()">
          <span style="font-size:1.5rem">📍</span>
          <span>Clock In</span>
        </button>
        <button class="btn btn-checkout" id="btn-checkout" onclick="doCheckOut()">
          <span style="font-size:1.5rem">✅</span>
          <span>Clock Out</span>
        </button>
        <button class="btn btn-history" onclick="showHistory()">
          <span>📅</span> My Attendance Log (This Month)
        </button>
      </div>

      <!-- Schedule Notification Toggle -->
      <div class="notif-card" id="notif-card">
        <div class="notif-info">
          <div class="notif-title">🔔 Schedule Notifications</div>
          <div class="notif-sub">Receive alerts 2 hours and 30 minutes before your schedule.</div>
          <span class="notif-status off" id="notif-status">Off</span>
        </div>
        <label class="toggle-wrap">
          <input type="checkbox" id="notif-toggle" onchange="handleNotifToggle(this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="driver-card" style="padding: 16px;">
        <div style="font-weight:700; margin-bottom:12px; font-size:1.1rem; text-align:left;">My Schedule</div>
        <div id="schedule-calendar">
          <div style="text-align:center; color:var(--muted); padding:20px;">Loading schedule...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal" id="history-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="history-modal-title">Attendance History</span>
        <button class="close-btn" onclick="closeHistory()">&times;</button>
      </div>
      <div class="modal-body" id="history-list">
        <div style="padding:20px; text-align:center; color:var(--muted);">Loading records...</div>
      </div>
    </div>
  </div>

  <script>
    const driverId = location.pathname.split('/').pop();

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      const dateStr = now.toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('clock').textContent = timeStr;
      document.getElementById('date-display').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function renderStatus(status, record) {
      const badge = document.getElementById('status-badge');
      const btnIn  = document.getElementById('btn-checkin');
      const btnOut = document.getElementById('btn-checkout');

      document.getElementById('info-checkin').textContent  = fmtTime(record?.clockIn);
      document.getElementById('info-checkout').textContent = fmtTime(record?.clockOut);

      // 버튼 상태 관리
      if (status === 'not_checked_in') {
        badge.textContent = '● Not Clocked In';
        badge.className = 'status-badge status-none';
        btnIn.disabled = false;
        btnOut.disabled = true;
      } else if (status === 'checked_in') {
        badge.textContent = '● Working';
        badge.className = 'status-badge status-in';
        btnIn.disabled = true;
        btnOut.disabled = false;
      } else if (status === 'completed') {
        badge.textContent = '✓ Clocked Out';
        badge.className = 'status-badge status-done';
        btnIn.disabled = true;
        btnOut.disabled = true;
      }
    }

    async function init() {
      try {
        const drvRes = await fetch(`/api/drivers/${driverId}`);
        if (!drvRes.ok) throw new Error('Driver not found.');
        const drv = await drvRes.json();

        document.getElementById('driver-name-el').textContent = drv.name;

        await loadTodayStatus();
        loadSchedules(); // load schedules for the calendar

        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display    = 'block';
      } catch (e) {
        document.getElementById('loading').textContent = '⚠️ ' + e.message;
      }
    }

    async function loadTodayStatus() {
      const stRes = await fetch(`/api/attendance/status/${driverId}`);
      const st = await stRes.json();

      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
      const attRes = await fetch(`/api/attendance?driverId=${driverId}&month=${today.slice(0, 7)}`);
      const recs = await attRes.json();
      const todayRec = recs.find(r => r.date === today) || null;

      renderStatus(st.status, todayRec);
    }

    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          ()  => resolve(null),
          { timeout: 8000, maximumAge: 0, enableHighAccuracy: true }
        );
      });
    }

    async function doCheckIn() {
      if(!confirm('Do you want to clock in?')) return;
      const btnIn = document.getElementById('btn-checkin');
      btnIn.disabled = true;
      btnIn.innerHTML = '<span style="font-size:1.5rem">📡</span><span>Getting location...</span>';
      try {
        const location = await getLocation();
        const res = await fetch('/api/attendance/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverId, location })
        });
        const data = await res.json();
        if (res.ok) {
          showResult('success', location ? '✅ Clocked in! Location saved.' : '✅ Clocked in! (Location unavailable)');
          await loadTodayStatus();
        } else {
          showResult('error', '⚠️ ' + data.error);
          btnIn.disabled = false;
        }
      } catch (e) {
        showResult('error', '⚠️ Network error occurred.');
        btnIn.disabled = false;
      } finally {
        btnIn.innerHTML = '<span style="font-size:1.5rem">📍</span><span>Clock In</span>';
      }
    }

    async function doCheckOut() {
      if(!confirm('Do you want to clock out?')) return;
      const btnOut = document.getElementById('btn-checkout');
      btnOut.disabled = true;
      btnOut.innerHTML = '<span style="font-size:1.5rem">📡</span><span>Getting location...</span>';
      try {
        const location = await getLocation();
        const res = await fetch('/api/attendance/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverId, location })
        });
        const data = await res.json();
        if (res.ok) {
          showResult('success', location
            ? `✅ Clocked out! (Today: ${data.record.hoursWorked} hours) Location saved.`
            : `✅ Clocked out! (Today: ${data.record.hoursWorked} hours)`);
          await loadTodayStatus();
        } else {
          showResult('error', '⚠️ ' + data.error);
          btnOut.disabled = false;
        }
      } catch (e) {
        showResult('error', '⚠️ Network error occurred.');
        btnOut.disabled = false;
      } finally {
        btnOut.innerHTML = '<span style="font-size:1.5rem">✅</span><span>Clock Out</span>';
      }
    }

    async function showHistory() {
      document.getElementById('history-modal-title').textContent = 'Attendance History';
      document.getElementById('history-modal').classList.add('active');
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Loading...</div>';
      
      try {
        const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
        const res = await fetch(`/api/attendance?driverId=${driverId}&month=${today.slice(0, 7)}`);
        const recs = await res.json();
        
        if (recs.length === 0) {
          listEl.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">No attendance records for this month.</div>';
          return;
        }

        let html = '';
        recs.slice().reverse().forEach(r => {
          if (!r.worked) return;
          const typeStr = r.dayType === 'holiday' ? 'Holiday' : 'Weekday';
          html += `
            <div class="history-item">
              <div>
                <div class="history-date">${r.date}</div>
                <span class="history-type">${typeStr}</span> <span style="font-size:0.8rem;color:var(--muted);margin-left:4px;">${r.hoursWorked} hrs</span>
              </div>
              <div class="history-times">
                <div>In: ${fmtTime(r.clockIn)}</div>
                <div>Out: ${fmtTime(r.clockOut)}</div>
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html || '<div style="padding:20px; text-align:center; color:var(--muted);">No attendance records for this month.</div>';
      } catch (e) {
        listEl.innerHTML = '<div style="padding:20px; text-align:center; color:var(--error);">Failed to load records.</div>';
      }
    }

    let currentSchMonth = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' }).slice(0, 7);
    let allSchedules = [];

    async function loadSchedules() {
      try {
        const res = await fetch(`/api/schedules?driverId=${driverId}&month=${currentSchMonth}`);
        allSchedules = await res.json();
        renderScheduleCalendar();
      } catch (e) {
        document.getElementById('schedule-calendar').innerHTML = '<div style="color:var(--error);text-align:center;">Failed to load schedules.</div>';
      }
    }

    function renderScheduleCalendar() {
      const [year, month] = currentSchMonth.split('-').map(Number);
      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let html = '<div class="calendar-header">';
      html += `<button class="btn" style="width:auto;padding:6px 12px;font-size:0.85rem;" onclick="changeSchMonth(-1)">◀</button>`;
      html += `<span style="font-weight:700;font-size:1.1rem;">${year}-${String(month).padStart(2,'0')}</span>`;
      html += `<button class="btn" style="width:auto;padding:6px 12px;font-size:0.85rem;" onclick="changeSchMonth(1)">▶</button>`;
      html += '</div>';

      html += '<div class="calendar-grid">';
      weekdays.forEach(d => { html += `<div class="calendar-weekday">${d}</div>`; });
      for (let i = 0; i < firstDay; i++) {
        html += '<div class="calendar-day empty"></div>';
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = dateStr === today;
        const isSun = new Date(year, month - 1, d).getDay() === 0;

        const daySchedules = allSchedules.filter(s => s.date === dateStr);
        let classes = 'calendar-day';
        if (isToday) classes += ' today';
        if (isSun) classes += ' holiday';

        const badge = daySchedules.length > 0 ? `<div class="sch-badge">${daySchedules.length}</div>` : '';
        html += `<div class="${classes}" onclick="showDaySchedule('${dateStr}')"><span>${d}</span>${badge}</div>`;
      }
      html += '</div>';
      document.getElementById('schedule-calendar').innerHTML = html;
    }

    function changeSchMonth(delta) {
      let [y, m] = currentSchMonth.split('-').map(Number);
      m += delta;
      if (m < 1) { m = 12; y--; }
      else if (m > 12) { m = 1; y++; }
      currentSchMonth = `${y}-${String(m).padStart(2,'0')}`;
      document.getElementById('schedule-calendar').innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">Loading schedule...</div>';
      loadSchedules();
    }

    function showDaySchedule(dateStr) {
      const daySchedules = allSchedules.filter(s => s.date === dateStr);
      const listEl = document.getElementById('history-list');
      
      let html = '';
      if (daySchedules.length === 0) {
        html = '<div style="padding:20px; text-align:center; color:var(--muted);">No schedules for this date.</div>';
      } else {
        daySchedules.forEach(s => {
          html += `
            <div class="history-item" style="flex-direction:column; align-items:flex-start;">
              <div style="font-weight:700; margin-bottom:6px; font-size:1.1rem; color:var(--text);">${s.time} - ${s.pickupPerson || 'Pickup'}</div>
              <div style="font-size:0.95rem; color:var(--text); line-height:1.4;">From: ${s.pickupLocation || 'N/A'}<br>To: ${s.destination || 'N/A'}</div>
              ${s.note ? `<div style="font-size:0.85rem; color:var(--muted); margin-top:8px; padding:6px; background:rgba(255,255,255,0.05); border-radius:6px;">📝 ${s.note}</div>` : ''}
            </div>
          `;
        });
      }
      
      document.getElementById('history-modal-title').textContent = `${dateStr} Schedule`;
      listEl.innerHTML = html;
      document.getElementById('history-modal').classList.add('active');
    }

    function closeHistory() {
      document.getElementById('history-modal').classList.remove('active');
    }

    function showResult(type, msg) {
      const el = document.getElementById('result-msg');
      el.textContent = msg;
      el.className = `result-msg ${type}`;
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // ── Push Notification Logic ─────────────────────────────────────────────
    let swRegistration = null;
    let VAPID_PUBLIC_KEY = '';

    // Convert VAPID base64 key to Uint8Array for browser subscription API
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function initServiceWorker() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        swRegistration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        // Fetch VAPID public key
        const res = await fetch('/api/push/vapid-public-key');
        const data = await res.json();
        VAPID_PUBLIC_KEY = data.publicKey;

        // Restore toggle state from localStorage
        const stored = localStorage.getItem(`notif_enabled_${driverId}`);
        if (stored === 'true') {
          // Verify subscription still exists
          const existing = await swRegistration.pushManager.getSubscription();
          if (existing) {
            setNotifUI(true);
          } else {
            // Subscription was lost (e.g. browser reinstall) — reset
            localStorage.removeItem(`notif_enabled_${driverId}`);
          }
        }
      } catch (e) {
        console.warn('[Push] SW init error:', e);
      }
    }

    function setNotifUI(enabled) {
      document.getElementById('notif-toggle').checked = enabled;
      const statusEl = document.getElementById('notif-status');
      statusEl.textContent = enabled ? 'On — alerts 2h & 30min before' : 'Off';
      statusEl.className = `notif-status ${enabled ? 'on' : 'off'}`;
    }

    async function handleNotifToggle(enable) {
      if (!swRegistration || !VAPID_PUBLIC_KEY) {
        alert('Push notifications are not supported in this browser.');
        setNotifUI(false);
        return;
      }

      if (enable) {
        // Request permission
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('Notification permission denied. Please enable it in browser settings.');
          setNotifUI(false);
          return;
        }

        try {
          // Unsubscribe any existing subscription first
          const existing = await swRegistration.pushManager.getSubscription();
          if (existing) await existing.unsubscribe();

          // Create new subscription
          const sub = await swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });

          // Save to server
          await fetch('/api/push/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ driverId, subscription: sub.toJSON() })
          });

          localStorage.setItem(`notif_enabled_${driverId}`, 'true');
          setNotifUI(true);

          // Send a test notification
          await fetch('/api/push/send-test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ driverId })
          });

          showResult('success', '🔔 Notifications enabled! You will be alerted 2h and 30min before each schedule.');
        } catch (e) {
          console.error('[Push] Subscribe error:', e);
          setNotifUI(false);
          showResult('error', '⚠️ Failed to enable notifications. Please try again.');
        }
      } else {
        // Disable: unsubscribe
        try {
          const existing = await swRegistration.pushManager.getSubscription();
          const endpoint = existing?.endpoint;
          if (existing) await existing.unsubscribe();

          await fetch('/api/push/unsubscribe', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ driverId, endpoint })
          });

          localStorage.removeItem(`notif_enabled_${driverId}`);
          setNotifUI(false);
          showResult('success', 'Notifications disabled.');
        } catch (e) {
          console.error('[Push] Unsubscribe error:', e);
        }
      }
    }

    // Initialize SW + Push on load
    initServiceWorker();

    init();
  </script>
</body>
</html>
